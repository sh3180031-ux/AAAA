name: download

# מופעל מהדשבורד (proxy-downloader.html) דרך repository_dispatch עם event_type: "download"
on:
  repository_dispatch:
    types: [download]

permissions:
  contents: write

# מכריח את כל ה-actions לרוץ על Node 24 (מעלים את אזהרת Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# חייב להתאים ל-findRun() בדשבורד
run-name: dl-${{ github.event.client_payload.request_id }}

jobs:
  fetch:
    # גרסה קבועה במקום ubuntu-latest, כדי שהמעבר לאובונטו 26 לא ישבור כלום
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODE: ${{ github.event.client_payload.mode }}
      URL: ${{ github.event.client_payload.url }}
      QUALITY: ${{ github.event.client_payload.quality }}
      REQ: ${{ github.event.client_payload.request_id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Show request
        run: |
          echo "mode=$MODE"
          echo "url=$URL"
          echo "quality=$QUALITY"
          mkdir -p out

      # ---------- כלים ----------
      - name: Install ffmpeg (only if missing)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install yt-dlp
        run: |
          python3 -m pip install --quiet --upgrade --pre "yt-dlp[default,curl-cffi]"
          yt-dlp --version

      # ---------- הורדה ----------
      - name: Download
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          DL_PROXY: ${{ secrets.DL_PROXY }}
        run: |
          set +e
          COOKIE_FILE="$RUNNER_TEMP/cookies.txt"

          # ---- פונקציה: הורדה עם yt-dlp (וידאו מכל אתר שנתמך) ----
          ytdlp_download () {
            COMMON=(--no-playlist --retries 10 --extractor-retries 5 --fragment-retries 10
                    --concurrent-fragments 8 --trim-filenames 150 --no-mtime
                    --remote-components ejs:github --js-runtimes node)
            if [ -n "$YT_COOKIES" ]; then
              printf '%s\n' "$YT_COOKIES" > "$COOKIE_FILE"
              COMMON+=(--cookies "$COOKIE_FILE")
            fi
            if [ -n "$DL_PROXY" ]; then
              COMMON+=(--proxy "$DL_PROXY")
            fi

            if [ "$QUALITY" = "audio" ]; then
              FMTARGS=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0)
            else
              case "$QUALITY" in
                1080) FMT="bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b" ;;
                720)  FMT="bv*[height<=720]+ba/b[height<=720]/bv*+ba/b" ;;
                480)  FMT="bv*[height<=480]+ba/b[height<=480]/bv*+ba/b" ;;
                *)    FMT="bv*+ba/b" ;;
              esac
              FMTARGS=(-f "$FMT" --merge-output-format mp4)
            fi
            OUT=(-o "out/%(title).120B [%(id)s].%(ext)s")

            echo "== Attempt 1: default =="
            yt-dlp "${COMMON[@]}" "${FMTARGS[@]}" "${OUT[@]}" "$URL" && return 0
            rm -f out/*.part out/*.ytdl

            echo "== Attempt 2: impersonate chrome =="
            yt-dlp "${COMMON[@]}" --impersonate chrome "${FMTARGS[@]}" "${OUT[@]}" "$URL" && return 0
            rm -f out/*.part out/*.ytdl

            echo "== Attempt 3: other YouTube clients =="
            yt-dlp "${COMMON[@]}" --impersonate chrome \
              --extractor-args "youtube:player_client=default,tv,web_safari,mweb" \
              "${FMTARGS[@]}" "${OUT[@]}" "$URL" && return 0
            rm -f out/*.part out/*.ytdl

            echo "== Attempt 4: simplest single file =="
            yt-dlp "${COMMON[@]}" --impersonate chrome -f "b/best" "${OUT[@]}" "$URL" && return 0
            return 1
          }

          # ---- פונקציה: הורדת קובץ ישיר עם curl ----
          curl_download () {
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            ( cd out && curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                -A "$UA" -O -J "$URL" ) && return 0
            rm -f out/*
            ( cd out && curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                -A "$UA" -o "downloaded_file" "$URL" ) && return 0
            rm -f out/*
            return 1
          }

          if [ "$MODE" = "file" ]; then
            curl_download && exit 0
            echo "curl failed -> trying yt-dlp as fallback"
            ytdlp_download && exit 0
          else
            ytdlp_download && exit 0
            echo "yt-dlp failed -> trying plain curl as fallback"
            curl_download && exit 0
          fi
          echo "::error::All download attempts failed"
          exit 1

      - name: List result
        run: |
          rm -f out/*.part out/*.ytdl
          ls -la out
          if [ -z "$(ls -A out)" ]; then echo "::error::No file was downloaded"; exit 1; fi

      # ---------- פרסום לענף downloads (הדשבורד מוריד משם, בלי בעיות CORS) ----------
      - name: Publish to downloads branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if find out -type f -size +95M | grep -q .; then
            echo "File larger than 95MB - skipping branch publish (artifact only)."
            exit 0
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB="$RUNNER_TEMP/pub"

          for attempt in 1 2 3 4 5; do
            rm -rf "$PUB"
            if git ls-remote --exit-code --heads "$REMOTE" downloads >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch downloads "$REMOTE" "$PUB"
            else
              mkdir -p "$PUB" && cd "$PUB" && git init -q && git checkout -q -b downloads \
                && git remote add origin "$REMOTE" && cd - >/dev/null
            fi
            cd "$PUB"
            # ניקוי אוטומטי: מוחק תיקיות ישנות מיממה כדי שהענף לא יתנפח
            NOW=$(date +%s)
            for d in dl-*; do
              [ -d "$d" ] || continue
              TS=$(cat "$d/.ts" 2>/dev/null || echo 0)
              if [ $((NOW - TS)) -gt 86400 ]; then git rm -rq "$d" || rm -rf "$d"; fi
            done

            rm -rf "dl-$REQ" && mkdir -p "dl-$REQ"
            cp "$GITHUB_WORKSPACE"/out/* "dl-$REQ/"
            echo "$NOW" > "dl-$REQ/.ts"
            git add -A
            git commit -qm "download $REQ" || true
            if git push -q origin downloads; then echo "published"; exit 0; fi
            cd "$GITHUB_WORKSPACE"
            echo "push conflict, retrying ($attempt)..."; sleep $((attempt * 3))
          done
          echo "::warning::Could not publish to branch; artifact is still available."

      # ---------- גיבוי: artifact (לקבצים גדולים מ-95MB) ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: result-${{ github.event.client_payload.request_id }}
          path: out/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
