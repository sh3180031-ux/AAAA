name: download

# מופעל מהדשבורד (proxy-downloader.html) דרך repository_dispatch עם event_type: "download"
on:
  repository_dispatch:
    types: [download]

permissions:
  contents: write
  actions: read

# מכריח את כל ה-actions לרוץ על Node 24 (מעלים את אזהרת Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# חייב להתאים ל-findRun() בדשבורד
run-name: dl-${{ github.event.client_payload.request_id }}

jobs:
  fetch:
    # גרסה קבועה במקום ubuntu-latest, כדי שהמעבר לאובונטו 26 לא ישבור כלום
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODE: ${{ github.event.client_payload.mode }}
      URL: ${{ github.event.client_payload.url }}
      QUALITY: ${{ github.event.client_payload.quality }}
      REQ: ${{ github.event.client_payload.request_id }}
    steps:
      - name: Show request
        run: |
          echo "mode=$MODE"
          echo "url=$URL"
          echo "quality=$QUALITY"
          mkdir -p out

      # ---------- הורדה ----------
      - name: Download
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          DL_PROXY: ${{ secrets.DL_PROXY }}
        run: |
          set +e
          COOKIE_FILE="$RUNNER_TEMP/cookies.txt"

          # ---- התקנה מהירה של הכלים, רק כשצריך ----
          tools_ready=0
          install_tools () {
            [ "$tools_ready" = 1 ] && return 0
            echo "== installing yt-dlp + ffmpeg =="
            python3 -m pip install --quiet --upgrade --pre "yt-dlp[default,curl-cffi]" &
            PIP=$!
            if ! command -v ffmpeg >/dev/null 2>&1; then
              # ffmpeg סטטי מוכן (כ-10 שניות) במקום apt-get (כדקה)
              curl -fsSL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
                || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
            fi
            wait $PIP
            yt-dlp --version && tools_ready=1
          }

          # ---- פונקציה: הורדה עם yt-dlp (וידאו מכל אתר שנתמך) ----
          ytdlp_download () {
            install_tools || return 1
            COMMON=(--no-playlist --retries 10 --extractor-retries 5 --fragment-retries 10
                    --concurrent-fragments 8 --trim-filenames 150 --no-mtime
                    --remote-components ejs:github --js-runtimes node)
            if [ -n "$YT_COOKIES" ]; then
              printf '%s\n' "$YT_COOKIES" > "$COOKIE_FILE"
              COMMON+=(--cookies "$COOKIE_FILE")
            fi
            if [ -n "$DL_PROXY" ]; then
              COMMON+=(--proxy "$DL_PROXY")
            fi

            if [ "$QUALITY" = "audio" ]; then
              FMTARGS=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0)
            else
              case "$QUALITY" in
                1080) FMT="bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b" ;;
                720)  FMT="bv*[height<=720]+ba/b[height<=720]/bv*+ba/b" ;;
                480)  FMT="bv*[height<=480]+ba/b[height<=480]/bv*+ba/b" ;;
                *)    FMT="bv*+ba/b" ;;
              esac
              FMTARGS=(-f "$FMT" --merge-output-format mp4)
            fi
            OUT=(-o "out/%(title).120B [%(id)s].%(ext)s")

            echo "== Attempt 1: default =="
            yt-dlp "${COMMON[@]}" "${FMTARGS[@]}" "${OUT[@]}" "$URL" && return 0
            rm -f out/*.part out/*.ytdl

            echo "== Attempt 2: impersonate chrome =="
            yt-dlp "${COMMON[@]}" --impersonate chrome "${FMTARGS[@]}" "${OUT[@]}" "$URL" && return 0
            rm -f out/*.part out/*.ytdl

            echo "== Attempt 3: other YouTube clients =="
            yt-dlp "${COMMON[@]}" --impersonate chrome \
              --extractor-args "youtube:player_client=default,tv,web_safari,mweb" \
              "${FMTARGS[@]}" "${OUT[@]}" "$URL" && return 0
            rm -f out/*.part out/*.ytdl

            echo "== Attempt 4: simplest single file =="
            yt-dlp "${COMMON[@]}" --impersonate chrome -f "b/best" "${OUT[@]}" "$URL" && return 0
            return 1
          }

          # ---- פונקציה: הורדת קובץ ישיר עם curl ----
          curl_download () {
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            ( cd out && curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                -A "$UA" -O -J "$URL" ) && return 0
            rm -f out/*
            ( cd out && curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                -A "$UA" -o "downloaded_file" "$URL" ) && return 0
            rm -f out/*
            return 1
          }

          if [ "$MODE" = "file" ]; then
            curl_download && exit 0
            echo "curl failed -> trying yt-dlp as fallback"
            ytdlp_download && exit 0
          else
            ytdlp_download && exit 0
            echo "yt-dlp failed -> trying plain curl as fallback"
            curl_download && exit 0
          fi
          echo "::error::All download attempts failed"
          exit 1

      - name: List result
        run: |
          rm -f out/*.part out/*.ytdl
          ls -la out
          if [ -z "$(ls -A out)" ]; then echo "::error::No file was downloaded"; exit 1; fi

      # ---------- ניקוי ענפי הורדה ישנים (מעל יממה) ----------
      - name: Clean old download branches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -d '-1 day' +%s)
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/dl-" --paginate \
            --jq '.[] | .ref + " " + .object.sha' | while read -r REF SHA; do
            D=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SHA" --jq .committer.date)
            if [ "$(date -d "$D" +%s)" -lt "$CUTOFF" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$REF" >/dev/null && echo "deleted $REF"
            fi
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/downloads" >/dev/null 2>&1 || true

      # ---------- פרסום לענף פרטי dl-<id> בחלקים של 25MB ----------
      # api.github.com הוא השרת היחיד של GitHub שהדפדפן מרשה לקרוא ממנו (CORS),
      # לכן הדשבורד מוריד את החלקים משם במקביל ומחבר אותם לקובץ אחד עם השם המקורי.
      - name: Publish to download branch
        id: pub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BR="dl-$REQ"
          PUB="$RUNNER_TEMP/pub"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$PUB" && mkdir -p "$PUB"

          python3 - "$GITHUB_WORKSPACE/out" "$PUB" << 'PY'
          import os, sys, json
          src, dst = sys.argv[1], sys.argv[2]
          CHUNK = 25 * 1024 * 1024
          files = []
          for i, name in enumerate(sorted(os.listdir(src))):
              path = os.path.join(src, name)
              if not os.path.isfile(path):
                  continue
              size = os.path.getsize(path)
              parts = []
              with open(path, 'rb') as f:
                  n = 0
                  while True:
                      buf = f.read(CHUNK)
                      if not buf and n > 0:
                          break
                      pname = f"{i:03d}_{n:04d}.part"
                      with open(os.path.join(dst, pname), 'wb') as o:
                          o.write(buf)
                      parts.append(pname)
                      n += 1
                      if not buf:
                          break
              files.append({"name": name, "size": size, "parts": parts})
          json.dump({"files": files}, open(os.path.join(dst, "manifest.json"), "w"), ensure_ascii=False)
          print(json.dumps(files, ensure_ascii=False))
          PY

          cd "$PUB"
          git init -q
          git checkout -q -b "$BR"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 1048576000
          git remote add origin "$REMOTE"

          FIRST=1
          push_batch () {
            git commit -qm "$BR" || return 0
            for t in 1 2 3 4 5; do
              if [ "$FIRST" = 1 ]; then git push -q -f origin "$BR" && { FIRST=0; return 0; }
              else git push -q origin "$BR" && return 0; fi
              echo "push failed, retry $t"; sleep $((t * 5))
            done
            return 1
          }
          SIZE=0
          for f in $(ls *.part | sort); do
            git add "$f"
            SIZE=$((SIZE + $(stat -c%s "$f")))
            if [ "$SIZE" -ge 838860800 ]; then push_batch; SIZE=0; fi
          done
          git add manifest.json
          push_batch
          echo "published to branch $BR"

      # ---------- גיבוי: artifact (לכפתור "הורד ישירות מ-GitHub") ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ github.event.client_payload.request_id }}
          path: out/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
