name: download

# Triggered by the HTML dashboard via a repository_dispatch POST to
# /repos/{owner}/{repo}/dispatches with event_type: "download"
on:
  repository_dispatch:
    types: [download]

# Needed so the job can push the result to the "downloads" branch.
permissions:
  contents: write

# run-name MUST match what the dashboard's findRun() looks for:
# target = 'dl-' + requestId  (checked against display_title / name)
run-name: dl-${{ github.event.client_payload.request_id }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show request
        run: |
          echo "mode=${{ github.event.client_payload.mode }}"
          echo "url=${{ github.event.client_payload.url }}"
          echo "quality=${{ github.event.client_payload.quality }}"

      - name: Prepare output dir
        run: mkdir -p out

      # ---------- VIDEO MODE (yt-dlp) ----------
      - name: Install ffmpeg
        if: github.event.client_payload.mode == 'video'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      - name: Install yt-dlp
        if: github.event.client_payload.mode == 'video'
        run: |
          python3 -m pip install --upgrade --pre "yt-dlp[default,curl-cffi]"
          yt-dlp --version

      - name: Download video
        if: github.event.client_payload.mode == 'video'
        env:
          URL: ${{ github.event.client_payload.url }}
          QUALITY: ${{ github.event.client_payload.quality }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          DL_PROXY: ${{ secrets.DL_PROXY }}
        run: |
          COMMON=(--retries 5 --extractor-retries 3 --fragment-retries 5
                  --remote-components ejs:github --js-runtimes node)

          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COMMON+=(--cookies cookies.txt)
          fi
          if [ -n "$DL_PROXY" ]; then
            COMMON+=(--proxy "$DL_PROXY")
          fi

          if [ "$QUALITY" = "audio" ]; then
            MODE=(-x --audio-format mp3)
          else
            case "$QUALITY" in
              1080) FMT="bestvideo[height<=1080]+bestaudio/best[height<=1080]" ;;
              720)  FMT="bestvideo[height<=720]+bestaudio/best[height<=720]" ;;
              480)  FMT="bestvideo[height<=480]+bestaudio/best[height<=480]" ;;
              *)    FMT="bestvideo+bestaudio/best" ;;
            esac
            MODE=(-f "$FMT" --merge-output-format mp4)
          fi

          OUT=(-o "out/%(title)s.%(ext)s")

          echo "== Attempt 1: default =="
          if yt-dlp "${COMMON[@]}" "${MODE[@]}" "${OUT[@]}" "$URL"; then exit 0; fi

          echo "== Attempt 2: impersonate chrome =="
          if yt-dlp "${COMMON[@]}" --impersonate chrome "${MODE[@]}" "${OUT[@]}" "$URL"; then exit 0; fi

          echo "== Attempt 3: simplest format =="
          yt-dlp "${COMMON[@]}" --impersonate chrome -f "best" "${OUT[@]}" "$URL"

      # ---------- FILE MODE (plain curl, no yt-dlp involved) ----------
      - name: Download file
        if: github.event.client_payload.mode == 'file'
        env:
          URL: ${{ github.event.client_payload.url }}
        run: |
          set -e
          cd out
          curl -L -O -J "$URL" || curl -L -o downloaded_file "$URL"

      - name: List result
        run: ls -la out

      # ---------- NEW: publish to the "downloads" branch (CORS-safe) ----------
      # The dashboard reads these files via the git blobs API, which does
      # send CORS headers, so no browser blocking. Works for files up to
      # ~100MB. Larger files won't commit — use the artifact backup instead.
      - name: Publish to downloads branch
        env:
          REQ: ${{ github.event.client_payload.request_id }}
        run: |
          set -e
          # size guard: skip anything over 95MB (git blobs API limit is 100MB)
          if find out -type f -size +95M | grep -q .; then
            echo "A file is larger than 95MB; skipping branch publish. Use the artifact backup."
            exit 0
          fi

          cp -r out /tmp/dl_out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin downloads >/dev/null 2>&1; then
            git fetch origin downloads
            git checkout -B downloads origin/downloads
          else
            git checkout --orphan downloads
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf "dl-$REQ"
          mkdir -p "dl-$REQ"
          cp /tmp/dl_out/* "dl-$REQ/"
          git add "dl-$REQ"
          git commit -m "download $REQ" || echo "nothing to commit"
          git push origin downloads

      # ---------- backup: keep the artifact too (for the GitHub-website link) ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.event.client_payload.request_id }}
          path: out/*
          retention-days: 1
          if-no-files-found: error
